<div *ngIf="visible" class="dialog-overlay">

  <div
    class="dialog-container"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog-title"
    aria-describedby="dialog-message">

    <div class="dialog-icon">
      ✓
    </div>

    <h2 id="dialog-title">
      {{ title }}
    </h2>

    <p id="dialog-message">
      {{ message }}
    </p>

    <button
      type="button"
      class="btn-confirm"
      (click)="onConfirm()">
      Aceptar
    </button>

  </div>

</div>
